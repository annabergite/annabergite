name: Update profile stats

on:
  schedule:
    - cron: '0 0 * * 1'   # 每周一 UTC 00:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Generate language stats
        run: python3 scripts/update_languages.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate activity graph
        run: python3 scripts/update_activity.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/languages.svg images/activity.svg
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: refresh profile stats"
            git push
          fi
